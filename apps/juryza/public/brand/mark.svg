<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b132b" />
      <stop offset="0.5" stop-color="#1c2541" />
      <stop offset="1" stop-color="#0a1128" />
    </linearGradient>
    <linearGradient id="gavelBody" x1="12" y1="6" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="checkGreen" x1="13" y1="8" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#ffffff" stroke-opacity="0.15" />

  <!-- Data Graph Nodes on Left -->
  <circle cx="5" cy="11" r="1.1" fill="#60a5fa" opacity="0.8" />
  <circle cx="5" cy="16" r="1.1" fill="#34d399" />
  <circle cx="5" cy="21" r="1.1" fill="#60a5fa" opacity="0.8" />
  <line x1="5" y1="11" x2="5" y2="21" stroke="#3b82f6" stroke-width="0.75" stroke-dasharray="1.5 1" opacity="0.5" />
  <line x1="5" y1="16" x2="9" y2="16" stroke="#10b981" stroke-width="0.75" opacity="0.6" />

  <!-- Data Graph Nodes on Right -->
  <circle cx="27" cy="11" r="1.1" fill="#60a5fa" opacity="0.8" />
  <circle cx="27" cy="16" r="1.1" fill="#34d399" />
  <circle cx="27" cy="21" r="1.1" fill="#60a5fa" opacity="0.8" />
  <line x1="27" y1="11" x2="27" y2="21" stroke="#3b82f6" stroke-width="0.75" stroke-dasharray="1.5 1" opacity="0.5" />
  <line x1="27" y1="16" x2="23" y2="16" stroke="#10b981" stroke-width="0.75" opacity="0.6" />

  <!-- Gavel Base / Sound Block -->
  <rect x="7" y="24" width="18" height="2.8" rx="1.4" fill="#ffffff" filter="url(#shadow)" />
  <rect x="8.5" y="22.5" width="15" height="1.8" rx="0.9" fill="#cbd5e1" />

  <!-- Gavel Handle -->
  <path d="M18.5 14.5L25.5 19.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" filter="url(#shadow)" />
  <circle cx="25.5" cy="19.5" r="1.2" fill="#e2e8f0" />

  <!-- Gavel Head Caps -->
  <rect x="9.5" y="5.5" width="13" height="2.2" rx="1.1" fill="#f8fafc" />
  <rect x="9.5" y="19" width="13" height="2.2" rx="1.1" fill="#e2e8f0" />

  <!-- Gavel Head Body -->
  <rect x="11" y="7" width="10" height="12.5" rx="1.8" fill="url(#gavelBody)" filter="url(#shadow)" />

  <!-- 3 Verification Checkmarks on Gavel Head -->
  <path d="M13 10.2L14.8 12L18.5 8.5" stroke="url(#checkGreen)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M13 13.7L14.8 15.5L18.5 12" stroke="url(#checkGreen)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M13 17.2L14.8 19L18.5 15.5" stroke="url(#checkGreen)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
